<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Segurança: origens permitidas (Supabase, mapa, fontes e CanvasKit do Flutter).
       Ao usar um serviço externo novo, inclua o endereço aqui. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://aurjqwqqrxaexmwozezr.supabase.co; connect-src 'self' https://aurjqwqqrxaexmwozezr.supabase.co wss://aurjqwqqrxaexmwozezr.supabase.co https://www.gstatic.com https://fonts.gstatic.com https://fonts.googleapis.com https://tile.openstreetmap.org; worker-src 'self' blob:; media-src 'self' data: blob:; manifest-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Esconde o app se ele for aberto dentro de um iframe de outro site. -->
  <script src="anti-enquadramento.js"></script>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Receba pedidos de clientes perto de você, em Brasília e no Entorno.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="iService Pro">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <meta name="theme-color" content="#FF8A00">

  <title>iService Profissional</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
