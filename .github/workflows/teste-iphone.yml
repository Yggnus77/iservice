# Testa os apps web no motor do Safari (WebKit, com tela e toque de iPhone) e no Safari
# de verdade dentro do simulador de iPhone (Mac do GitHub). Não cria conta nem grava no banco:
# no site publicado vai só até antes de criar a conta; telas de quem está logado usam a
# versão de demonstração (dados de exemplo). Resultado: aba Actions > execução > "Artifacts".
name: Teste no iPhone (Safari)

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['tools/teste-iphone/**', '.github/workflows/teste-iphone.yml']

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - run: bash tools/teste-iphone/montar_demo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: demo-web
          path: |
            apps/cliente/build/demo
            apps/profissional/build/demo
          retention-days: 3

  webkit:
    needs: demo
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: demo-web, path: demo-web }
      - name: Servir a demonstração
        run: |
          ls demo-web || true
          (cd demo-web/cliente/build/demo 2>/dev/null && nohup python3 -m http.server 8101 >/dev/null 2>&1 &)
          (cd demo-web/profissional/build/demo 2>/dev/null && nohup python3 -m http.server 8102 >/dev/null 2>&1 &)
      - name: WebKit
        run: |
          cd tools/teste-iphone
          npm init -y >/dev/null && npm i playwright@1.63.0 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
          node testar_webkit.js "$GITHUB_WORKSPACE/capturas-webkit"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capturas-webkit, path: capturas-webkit, retention-days: 14 }

  simulador:
    needs: demo
    if: always()
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: demo-web, path: demo-web }
      - name: Servir a demonstração
        run: |
          (cd demo-web/cliente/build/demo 2>/dev/null && nohup python3 -m http.server 8101 >/dev/null 2>&1 &)
          (cd demo-web/profissional/build/demo 2>/dev/null && nohup python3 -m http.server 8102 >/dev/null 2>&1 &)
      - run: bash tools/teste-iphone/simulador.sh "$GITHUB_WORKSPACE/capturas-simulador"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capturas-simulador, path: capturas-simulador, retention-days: 14 }

  # Guarda as capturas no próprio ramo (pasta capturas-teste-iphone/) para consulta rápida.
  # Só quando rodado à mão (Run workflow) num ramo claude/**; apague a pasta antes de mesclar.
  juntar:
    needs: [webkit, simulador]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'claude/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: 'capturas-*', path: capturas-teste-iphone }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capturas-teste-iphone
          git commit -m "Capturas do teste no iPhone (${GITHUB_SHA::7})" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
