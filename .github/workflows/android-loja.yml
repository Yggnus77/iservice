# Gera os pacotes .aab dos dois apps assinados com a chave de upload,
# prontos para enviar à Play Store (Play Console > Testar e lançar).
# Só roda pelo botão "Run workflow" na aba Actions.
#
# Precisa de dois segredos no GitHub (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64  conteúdo do arquivo iservice-upload-base64.txt
#   ANDROID_KEYSTORE_SENHA   senha da chave
# O número da versão (versionCode) sobe sozinho a cada execução.
name: Pacotes para a Play Store (Android)

on:
  workflow_dispatch:
  # TEMPORÁRIO: para testar no ramo antes de mesclar. Remover antes do merge.
  push:
    branches: [claude/project-thread-lhrom5]

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
      ANDROID_KEY_ALIAS: upload
    steps:
      - uses: actions/checkout@v4
      - name: Conferir segredos
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_SENHA" ]; then
            echo "::error::Faltam os segredos ANDROID_KEYSTORE_BASE64 e/ou ANDROID_KEYSTORE_SENHA no GitHub."
            exit 1
          fi
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/iservice-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_SENHA" -alias "$ANDROID_KEY_ALIAS" > /dev/null \
            || { echo "::error::A chave ou a senha não conferem."; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      # Endereço do Supabase e chave publicável (pública por natureza; já vai nos apps web).
      - name: Configuração
        run: |
          cat > config/dev.json <<'JSON'
          {
            "SUPABASE_URL": "https://aurjqwqqrxaexmwozezr.supabase.co",
            "SUPABASE_ANON_KEY": "sb_publishable_Gc3o5rwSwK-ID6cYTGPmZA_8NO1hqkW"
          }
          JSON
      - run: flutter pub get
      - name: Compilar
        run: |
          for app in cliente profissional; do
            (cd apps/$app && flutter build appbundle --release \
              --build-number=${{ github.run_number }} \
              --dart-define-from-file=../../config/dev.json \
              --dart-define-from-file=../../config/firebase.json)
            cp apps/$app/build/app/outputs/bundle/release/app-release.aab iservice-$app.aab
          done
      - name: Conferir assinatura
        run: |
          for f in iservice-*.aab; do
            jarsigner -verify -verbose -certs "$f" | grep -q "CN=iService" \
              || { echo "::error::$f não está assinado com a chave de upload."; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: iservice-play-store-${{ github.run_number }}
          path: iservice-*.aab
          retention-days: 30
      - name: Apagar a chave do servidor
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
