name: iservice_core
description: "Base compartilhada dos apps iService: tema, dados e componentes."
version: 0.0.1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"
resolution: workspace

dependencies:
  cached_network_image: ^4.0.5
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.2
  go_router: ^18.1.1
  google_fonts: ^8.0.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  mask_text_input_formatter: ^2.9.0
  material_symbols_icons: ^4.2960.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

