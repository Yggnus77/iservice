<style>

  .confirma .cartao { width: 100%; max-width: 480px; background: #fff; border: 1px solid var(--linha); border-radius: 24px; padding: 40px 28px 32px; text-align: center; box-shadow: 0 24px 60px -32px rgba(10, 31, 68, .35); position: relative; overflow: hidden; }

  .confirma .selo { width: 104px; height: 104px; margin: 4px auto 22px; border-radius: 50%; display: grid; place-items: center; background: #E6F6EE; color: #1FA463; animation: surgir .45s cubic-bezier(.34, 1.56, .64, 1); }

  .confirma.erro .selo { background: #FFF1E0; color: #C25E00; }
  .confirma h1 { font-size: 28px; line-height: 1.2; margin: 0 0 10px; color: var(--tinta); }
  .confirma p { margin: 0 0 24px; color: var(--tinta-suave, #4A5A78); font-size: 16px; line-height: 1.6; }
  .confirma .botoes { display: grid; gap: 12px; }
  .confirma .botoes .btn { width: 100%; justify-content: center; }
  .confirma small { display: block; margin-top: 22px; color: #8A97AD; font-size: 13px; line-height: 1.5; }
  @keyframes surgir { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
